<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=yes" />
    <title>#listeningclub entries</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='b' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%238a6cff'/><stop offset='1' stop-color='%233a1e9e'/></linearGradient><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23fff' stop-opacity='.6'/><stop offset='1' stop-color='%23fff' stop-opacity='0'/></linearGradient></defs><rect x='1' y='1' width='30' height='30' rx='7.5' fill='url(%23b)'/><g fill='%23fff'><rect x='16' y='8' width='2.4' height='13.5'/><ellipse cx='12.6' cy='22' rx='4.3' ry='3.4' transform='rotate(-22 12.6 22)'/><path d='M18.4 8c4.3 1.1 5.6 4.2 3.6 8 .8-3.6-.8-5.6-3.6-6.2z'/></g><rect x='3.5' y='3' width='25' height='11' rx='5.5' fill='url(%23s)'/></svg>" />
  </head>
  <script>
    async function fetchEntries() {
      const tsv = await fetch("./entries.tsv");
      const data = await tsv.text();
      const results = [];
      for (const row of data.split("\n")) {
        if (!row.trim().length) {
          continue;
        }
        const [date, selector, album, artist] = row.split("\t");
        if (date === "Date") continue;
        if (selector === "-") continue;
        results.push({ date, selector, album, artist });
      }
      return results;
    }

    let entries = [];

    function createRows() {
      const tbody = document.querySelector("#entries tbody");
      tbody.innerHTML = "";

      const filter = (document.getElementById("filter").value ?? "").toLowerCase().trim();

      let filteredEntries = entries;
      if (filter) {
        filteredEntries = entries.filter(
          (e) =>
            e.date?.toLowerCase().includes(filter) ||
            e.selector?.toLowerCase().includes(filter) ||
            e.album?.toLowerCase().includes(filter) ||
            e.artist?.toLowerCase().includes(filter),
        );
      }

      document.getElementById("info").textContent = `Showing ${filteredEntries.length} of ${entries.length} entries`;

      let lastYear = null;
      for (const entry of filteredEntries) {
        const tr = document.createElement("tr");
        const year = entry.date ? entry.date.split("-")[0] : null;
        if (lastYear && year !== lastYear) {
          tr.classList.add("new-year");
        }
        lastYear = year;

        tr.appendChild(
          Object.assign(document.createElement("td"), {
            textContent: entry.date || "",
            className: "date",
          }),
        );

        tr.appendChild(
          Object.assign(document.createElement("td"), {
            textContent: entry.selector || "",
          }),
        );

        tr.appendChild(
          Object.assign(document.createElement("td"), {
            textContent: entry.album || "",
          }),
        );

        tr.appendChild(
          Object.assign(document.createElement("td"), {
            textContent: entry.artist || "",
          }),
        );

        tbody.appendChild(tr);
      }
    }

    async function init() {
      entries = await fetchEntries();
      createRows();
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      font-size: 12pt;
      line-height: 1.5;
    }

    main {
      max-width: 80em;
      margin: auto;
      padding: 1em;
    }

    input {
      width: 100%;
      padding: 1em;
      margin-bottom: 0.5em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td,
    th {
      border-bottom: #eee solid 1px;
      padding: 0.2em;
      text-align: left;
    }

    tr.new-year td {
      border-top: #ccc solid 2px;
    }

    th {
      background-color: #f8f8f8;
      font-weight: bold;
      position: sticky;
      top: 0;
      vertical-align: bottom;
    }

    tr:hover td {
      background-color: #f8f8f8;
    }

    .date {
      white-space: nowrap;
      font-variant: tabular-nums;
    }

    #info {
      margin: 0.5em 0;
      opacity: 0.6;
      font-size: 90%;
    }
  </style>
  <body onload="init()">
    <main>
      <h1>#listeningclub entries</h1>
      <input
        type="search"
        id="filter"
        placeholder="Filter by date, selector, album, or artist..."
        autofocus
        oninput="createRows()"
      />
      <p id="info"></p>
      <table id="entries">
        <thead>
          <tr>
            <th>Date</th>
            <th>Selector</th>
            <th>Album</th>
            <th>Artist</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </body>
</html>
